dependencies {
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.2'
    implementation 'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.github.victools:jsonschema-generator:4.31.1'


    implementation 'org.glassfish.jaxb:jaxb-xjc:4.0.3'
}

// Task to generate Java classes from XSD

task generateJaxbClasses {
    def outputDir = file("${buildDir}/generated-sources/jaxb")
    def schemaDir = file("src/main/resources/schema")
    inputs.dir schemaDir
    outputs.dir outputDir
    doLast {
        // Create output directory
        outputDir.mkdirs()
        // Find all XSD files
        fileTree(dir: schemaDir).include('**/*.xsd').each { xsdFile ->
            // Run XJC compiler
            ant.taskdef(name: 'xjc',
                    classname: 'com.sun.tools.xjc.XJCTask',
                    classpath: configurations.runtimeClasspath.asPath)
            ant.xjc(destdir: outputDir,
                    package: 'com.example.generated',
                    schema: xsdFile) {
                arg(value: '-extension')
                produces(dir: outputDir, includes: '**/*.java')
            }
        }
    }
}

// Add generated sources to Java compilation
sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated-sources/jaxb"
        }
    }
}

compileJava {
    doFirst {
        options.compilerArgs = [
                '--module-path', classpath.asPath,
        ]
        classpath = files()
    }
}

